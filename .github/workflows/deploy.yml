name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# `contents: read`, not write. Nothing in this workflow commits: the CACHE_VERSION
# bump below is a `sed` on the checkout that feeds the build, and what ships is the
# uploaded artifact. A write grant on the default token is a standing ability to push
# to this repository, held by every step and every action version they resolve to, for
# no reason either job needs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# This job duplicates most of ci.yml, which runs on the same push. Left in place
# deliberately: chaining them with `workflow_run` is the tidy fix and it changes when
# and whether the deploy fires at all, which is not a change worth making blind. The
# cost is ~2 minutes of runner time per merge; the cost of getting the chain wrong is a
# deploy that silently stops happening. Noted 2026-09-13 (Genspark §6.4) so the next
# person weighing it has the reasoning rather than only the observation.
#
# Re-reported by two further external audits on 2026-09-14 (and by a third as
# "gate parity protects ci.yml, not deploy.yml", which is the same fact). Still
# deliberate, for the reason above. It is recorded here a second time because an
# audit that only greps the workflow files will keep finding it, and the answer
# should be readable from the file rather than from the changelog.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --run
      # Item 134, and this job is where it bites hardest: the build step below
      # regenerates src/data/cards.js from src/data/source/, so a direct edit to
      # the generated file is silently reverted at deploy. verify-content.mjs is
      # the only check that catches it and it lives here, in audit:full, which
      # nothing ran.
      - name: Data audits
        run: npm run audit:full

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Merge card sources
        run: node scripts/merge-cards.mjs

      # Auto-bump SW cache version on every deploy (prevents stale cache)
      - name: Bump SW cache version
        run: |
          VERSION="v$(date -u +%Y%m%d%H%M%S)"
          sed -i "s/const CACHE_VERSION = '[^']*'/const CACHE_VERSION = '$VERSION'/" public/sw.js
          echo "Bumped CACHE_VERSION to $VERSION"

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
