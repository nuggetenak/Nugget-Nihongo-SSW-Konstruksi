<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / Theme -->
    <meta name="theme-color" content="#F59E0B" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SSW Konstruksi" />

    <!-- SEO / Social -->
    <meta
      name="description"
      content="Aplikasi belajar ujian SSW Konstruksi Jepang — flashcard, kuis, simulasi ujian, dan SRS cerdas untuk tenaga kerja Indonesia."
    />
    <meta name="application-name" content="SSW Konstruksi" />
    <meta property="og:title" content="SSW Konstruksi · Nugget Nihongo" />
    <meta
      property="og:description"
      content="Belajar ujian SSW Konstruksi Jepang — 1.443 kartu flashcard, soal JAC, dan sistem ulang cerdas (SRS)."
    />
    <meta property="og:type" content="website" />

    <title>SSW Konstruksi · Nugget Nihongo</title>

    <!-- Manifest -->
    <link rel="manifest" href="/Nugget-Nihongo-SSW-Konstruksi/manifest.webmanifest" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/Nugget-Nihongo-SSW-Konstruksi/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      href="/Nugget-Nihongo-SSW-Konstruksi/favicon.png"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/png"
      href="/Nugget-Nihongo-SSW-Konstruksi/icons/icon-192x192.png"
      sizes="192x192"
    />

    <!-- Apple touch icons -->
    <link rel="apple-touch-icon" href="/Nugget-Nihongo-SSW-Konstruksi/icons/apple-touch-icon.png" />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/Nugget-Nihongo-SSW-Konstruksi/icons/icon-152x152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/Nugget-Nihongo-SSW-Konstruksi/icons/icon-180x180.png"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900&family=Noto+Sans+JP:wght@400;500;700;900&family=Syne:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: 'DM Sans', 'Noto Sans JP', system-ui, sans-serif;
        background: #fffdf5;
        color: #1c1917;
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
        /* Prevent bounce/overscroll showing white bg on iOS */
        overscroll-behavior: none;
      }
      #root {
        min-height: 100dvh;
      }

      /* Skip nav link — visually hidden until focused */
      .skip-nav {
        position: absolute;
        top: -100px;
        left: 8px;
        z-index: 9999;
        background: #f59e0b;
        color: #0c0a09;
        font-weight: 700;
        font-size: 14px;
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
        transition: top 0.1s ease;
      }
      .skip-nav:focus {
        top: 8px;
      }
      /* Splash screen flicker prevention */
      #root:empty::before {
        content: '';
        display: block;
        width: 100%;
        height: 100dvh;
        background: #fffdf5;
      }
    </style>

    <!-- Service Worker registration — inline to register before any JS loads -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/Nugget-Nihongo-SSW-Konstruksi/sw.js', {
              scope: '/Nugget-Nihongo-SSW-Konstruksi/',
            })
            .then(function (reg) {
              // Check for SW updates every time the page loads
              reg.update();

              // E1: Listen for new SW waiting — show update prompt
              reg.addEventListener('updatefound', function () {
                var newSW = reg.installing;
                if (!newSW) return;
                newSW.addEventListener('statechange', function () {
                  if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                    // New version ready — show toast-style banner
                    var banner = document.createElement('div');
                    banner.id = 'sw-update-banner';
                    banner.innerHTML =
                      '🆕 Versi baru tersedia! <button onclick="document.getElementById(\'sw-update-banner\').remove();window.location.reload();" style="margin-left:8px;padding:4px 10px;border-radius:6px;border:none;background:#f59e0b;color:#fff;font-weight:700;cursor:pointer;font-size:12px">Perbarui</button>';
                    banner.style.cssText =
                      'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1c1917;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.4);white-space:nowrap;border:1px solid rgba(245,158,11,0.4)';
                    document.body.appendChild(banner);
                  }
                });
              });
            })
            .catch(function (err) {
              console.warn('[SW] Registration failed:', err);
            });
        });
      }
    </script>
  </head>
  <body>
    <!-- Skip navigation for keyboard users -->
    <a href="#main-content" class="skip-nav">Langsung ke konten</a>
    <div id="root" role="application" aria-label="SSW Konstruksi"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
