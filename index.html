    <!-- Fonts: self-hosted, subsetted to this app's actual character set
         (item 61, 2026-08-26). See public/fonts/LICENSE.txt for the SIL OFL
         attribution this requires, and docs/DESIGN_SPEC.md §3 for how the
         subset was built and verified. -->
    <style>
      @font-face {
        font-family: 'DM Sans';
        font-style: normal;
        font-weight: 100 1000;
        font-display: swap;
        src: url('/Nugget-Nihongo-SSW-Konstruksi/fonts/DMSans.woff2') format('woff2-variations'),
          url('/Nugget-Nihongo-SSW-Konstruksi/fonts/DMSans.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Syne';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/Nugget-Nihongo-SSW-Konstruksi/fonts/Syne.woff2') format('woff2-variations'),
          url('/Nugget-Nihongo-SSW-Konstruksi/fonts/Syne.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Noto Sans JP';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/Nugget-Nihongo-SSW-Konstruksi/fonts/NotoSansJP-Regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Noto Sans JP';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/Nugget-Nihongo-SSW-Konstruksi/fonts/NotoSansJP-Medium.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Noto Sans JP';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/Nugget-Nihongo-SSW-Konstruksi/fonts/NotoSansJP-Bold.woff2') format('woff2');

        font-family: 'Noto Sans JP';
        font-style: normal;
        font-weight: 900;
        font-display: swap;
        src: url('/Nugget-Nihongo-SSW-Konstruksi/fonts/NotoSansJP-Black.woff2') format('woff2');
      }
    </style>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: 'DM Sans', 'Noto Sans JP', system-ui, sans-serif;
        background: #fffdf5;
        color: #1c1917;
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
        /* Prevent bounce/overscroll showing white bg on iOS */
        overscroll-behavior: none;
      }
      #root {
        min-height: 100dvh;
      }

      /* Skip nav link — visually hidden until focused */
      .skip-nav {
        position: absolute;
        top: -100px;
        left: 8px;
        z-index: 9999;
        background: #f59e0b;
        color: #0c0a09;
        font-weight: 700;
        font-size: 14px;
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
        transition: top 0.1s ease;
      }
      .skip-nav:focus {
        top: 8px;
      }
      /* Splash screen flicker prevention */
      #root:empty::before {
        content: '';
        display: block;
        width: 100%;
        height: 100dvh;
        background: #fffdf5;
      }
    </style>

    <!-- Service Worker registration — inline to register before any JS loads.
         Update UI lives entirely in App.jsx's registration-watching effect (a
         themed, dismissible toast) — this used to also build its own raw DOM
         banner here, which meant two competing update notifications could show
         at once. See UI_UX_PLAN.md item 6. As of item 37, the new worker waits
         for the user to accept before taking over (see App.jsx + sw.js). -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/Nugget-Nihongo-SSW-Konstruksi/sw.js', {
              scope: '/Nugget-Nihongo-SSW-Konstruksi/',
            })
            .then(function (reg) {
              // Check for SW updates every time the page loads
              reg.update();
            })
            .catch(function (err) {
              console.warn('[SW] Registration failed:', err);
            });
        });
      }
    </script>
  </head>
  <body>
    <!-- Skip navigation for keyboard users -->
    <a href="#main-content" class="skip-nav">Langsung ke konten</a>
    <div id="root" aria-label="SSW Konstruksi"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
